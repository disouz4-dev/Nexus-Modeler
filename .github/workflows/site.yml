name: Site no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "packaging/instalar.sh"
      - "packaging/instalar.ps1"
      - "packaging/instalar-windows.ps1"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar o site
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Os instaladores de terminal também ficam no site, para o comando ser
      # curto: curl -fsSL https://disouz4-dev.github.io/Nexus-Modeler/instalar.sh | bash
      - name: Instaladores de terminal no site
        run: cp packaging/instalar.sh packaging/instalar.ps1 packaging/instalar-windows.ps1 docs/site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

      - id: publicacao
        uses: actions/deploy-pages@v4
