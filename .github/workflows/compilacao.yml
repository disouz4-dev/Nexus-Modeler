name: Compilação e testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.maquina }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Linux
            maquina: ubuntu-24.04
          - nome: Windows
            maquina: windows-2022
          - nome: Mac (Intel e Apple Silicon)
            maquina: macos-15
    env:
      NEXUS_CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev pkg-config \
            libcurl4-openssl-dev

      - name: Configurar (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configurar (Mac, binário universal)
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configurar (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel 4

      - name: Testes do motor e do plugin
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Testes do motor e do plugin (Linux, tela virtual)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure

      - name: Validar o AU com a ferramenta da Apple
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/plugin/NexusModeler_artefacts/Release/AU/Nexus Modeler.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aumf Nxm1 Nxsm

      # pluginval (Tracktion, código aberto): o validador que o mercado usa para
      # conferir se o plugin funciona nos programas de gravação. Nível 5 abre e
      # fecha o plugin, troca taxa e bloco, automação aleatória, salva e
      # restaura o estado e abre a tela.
      - name: Validar o VST3 com o pluginval (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -qo pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process --validate "build/plugin/NexusModeler_artefacts/Release/VST3/Nexus Modeler.vst3"

      - name: Validar o VST3 e o AU com o pluginval (Mac)
        if: runner.os == 'macOS'
        run: |
          curl -sfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -qo pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --validate "build/plugin/NexusModeler_artefacts/Release/VST3/Nexus Modeler.vst3"
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --validate "$HOME/Library/Audio/Plug-Ins/Components/Nexus Modeler.component"

      - name: Validar o VST3 com o pluginval (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          unzip -qo pluginval.zip
          ./pluginval.exe --strictness-level 5 --validate-in-process --validate "build/plugin/NexusModeler_artefacts/Release/VST3/Nexus Modeler.vst3"

      - name: Guardar os plugins compilados
        uses: actions/upload-artifact@v4
        with:
          name: nexus-modeler-${{ runner.os }}
          path: |
            build/plugin/NexusModeler_artefacts/Release/
            build/medidas/
          if-no-files-found: error
